<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ArcGIS Pro Benchmark Results</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      min-height: 100vh;
      padding: 24px 16px;
    }

    header {
      max-width: 1100px;
      margin: 0 auto 32px;
    }

    header h1 {
      font-size: 1.75rem;
      font-weight: 700;
      color: #58a6ff;
      margin-bottom: 4px;
    }

    header p {
      color: #8b949e;
      font-size: 0.9rem;
    }

    .controls {
      max-width: 1100px;
      margin: 0 auto 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
    }

    .controls label {
      font-size: 0.85rem;
      color: #8b949e;
    }

    select, button {
      background: #161b22;
      border: 1px solid #30363d;
      color: #e6edf3;
      border-radius: 6px;
      padding: 6px 12px;
      font-size: 0.875rem;
      cursor: pointer;
    }

    select:hover, button:hover {
      border-color: #58a6ff;
    }

    button {
      background: #21262d;
    }

    button:active { opacity: 0.7; }

    #status {
      font-size: 0.82rem;
      color: #8b949e;
      margin-left: auto;
    }

    .section {
      max-width: 1100px;
      margin: 0 auto 40px;
    }

    .section h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: #f0f6fc;
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid #21262d;
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(480px, 1fr));
      gap: 20px;
    }

    .chart-card {
      background: #161b22;
      border: 1px solid #21262d;
      border-radius: 10px;
      padding: 20px;
    }

    .chart-card h3 {
      font-size: 0.9rem;
      font-weight: 600;
      color: #c9d1d9;
      margin-bottom: 14px;
      text-transform: capitalize;
    }

    .chart-wrapper {
      position: relative;
      height: 260px;
    }

    .systems-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }

    .systems-table th, .systems-table td {
      padding: 8px 12px;
      text-align: left;
      border-bottom: 1px solid #21262d;
    }

    .systems-table th {
      color: #8b949e;
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .systems-table td { color: #c9d1d9; }
    .systems-table tr:hover td { background: #1c2128; }

    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 600;
      background: #1f6feb22;
      color: #58a6ff;
      border: 1px solid #1f6feb55;
    }

    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #8b949e;
      font-size: 0.9rem;
    }

    .empty a { color: #58a6ff; }

    .tooltip-meta {
      font-size: 0.75rem;
      color: #8b949e;
    }
  </style>
</head>
<body>

<header>
  <h1>ArcGIS Pro Benchmark Results</h1>
  <p>Compare geoprocessing performance across systems — powered by GitHub Pages</p>
</header>

<div class="controls">
  <label>Metric:</label>
  <select id="metricSelect">
    <option value="mean">Mean (s)</option>
    <option value="median">Median (s)</option>
    <option value="min">Min (s)</option>
    <option value="max">Max (s)</option>
  </select>

  <label>Results:</label>
  <select id="fileSelect" multiple size="1" style="min-width:240px">
    <option disabled>Loading…</option>
  </select>

  <button id="toggleAll">Select All</button>
  <button id="refreshBtn">↺ Refresh</button>

  <span id="status"></span>
</div>

<div id="systemsSection" class="section" style="display:none">
  <h2>Systems</h2>
  <table class="systems-table">
    <thead>
      <tr>
        <th>#</th>
        <th>Label</th>
        <th>CPU</th>
        <th>RAM (GB)</th>
        <th>GPU</th>
        <th>ArcGIS</th>
        <th>Date</th>
      </tr>
    </thead>
    <tbody id="systemsBody"></tbody>
  </table>
</div>

<div id="chartsRoot"></div>

<script>
  // ── Config ──────────────────────────────────────────────────────────────────
  const OWNER = 'pkt1213lab';
  const REPO  = 'Benchmarking';
  const RESULTS_PATH = 'results';

  // Palette – up to 12 distinct system colours
  const PALETTE = [
    '#58a6ff','#3fb950','#f0883e','#d2a8ff','#ffa657','#79c0ff',
    '#56d364','#ff7b72','#ffa198','#a5d6ff','#ffb77a','#b3f0a1'
  ];

  // ── State ───────────────────────────────────────────────────────────────────
  let allResults   = {};   // filename → parsed JSON
  let activeFiles  = new Set();
  let charts       = {};   // chart key → Chart instance

  // ── DOM refs ────────────────────────────────────────────────────────────────
  const fileSelect   = document.getElementById('fileSelect');
  const metricSelect = document.getElementById('metricSelect');
  const toggleAllBtn = document.getElementById('toggleAll');
  const refreshBtn   = document.getElementById('refreshBtn');
  const statusEl     = document.getElementById('status');
  const chartsRoot   = document.getElementById('chartsRoot');
  const systemsBody  = document.getElementById('systemsBody');
  const systemsSec   = document.getElementById('systemsSection');

  // ── Helpers ─────────────────────────────────────────────────────────────────
  function setStatus(msg) { statusEl.textContent = msg; }

  function humanLabel(r) {
    // Try to build a short system label from the result metadata
    const si = r.system_info || {};
    const cpu = si.cpu_model || '';
    const short = cpu.replace(/Intel|AMD|Core|Processor|\(R\)|\(TM\)/gi,'').trim().split(/\s+/).slice(0,3).join(' ');
    const ts = (r.timestamp || r.benchmark_id || '').slice(0,10);
    return short ? `${short} · ${ts}` : (r.benchmark_id || 'unknown');
  }

  // ── Fetch file list from GitHub Contents API ─────────────────────────────────
  async function fetchFileList() {
    const url = `https://api.github.com/repos/${OWNER}/${REPO}/contents/${RESULTS_PATH}`;
    const res = await fetch(url, { headers: { Accept: 'application/vnd.github+json' } });
    if (!res.ok) throw new Error(`GitHub API ${res.status}: ${res.statusText}`);
    const items = await res.json();
    return items.filter(f => f.name.endsWith('.json')).map(f => f.download_url);
  }

  // ── Fetch & parse a single result JSON ───────────────────────────────────────
  async function fetchResult(url) {
    const res = await fetch(url);
    if (!res.ok) throw new Error(`Failed to fetch ${url}`);
    return res.json();
  }

  // ── Populate the <select> ────────────────────────────────────────────────────
  function populateSelect(urls) {
    fileSelect.innerHTML = '';
    fileSelect.size = Math.min(urls.length, 8);
    urls.forEach(url => {
      const name = url.split('/').pop();
      const opt  = document.createElement('option');
      opt.value = url;
      opt.textContent = name;
      fileSelect.appendChild(opt);
    });
    // Select all by default
    for (const opt of fileSelect.options) opt.selected = true;
    syncActiveFiles();
  }

  function syncActiveFiles() {
    activeFiles = new Set([...fileSelect.selectedOptions].map(o => o.value));
  }

  // ── Systems table ────────────────────────────────────────────────────────────
  function renderSystemsTable(orderedUrls) {
    systemsBody.innerHTML = '';
    orderedUrls.forEach((url, idx) => {
      const r  = allResults[url];
      if (!r) return;
      const si = r.system_info || {};
      const ag = si.arcgis_version || {};
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td><span class="badge" style="background:${PALETTE[idx % PALETTE.length]}22;color:${PALETTE[idx % PALETTE.length]};border-color:${PALETTE[idx % PALETTE.length]}55">${idx+1}</span></td>
        <td>${humanLabel(r)}</td>
        <td>${si.cpu_model || '—'}</td>
        <td>${si.ram_gb ?? '—'}</td>
        <td>${si.gpu_model || '—'}</td>
        <td>${typeof ag === 'object' ? (ag.version || '—') + (ag.build ? ' b'+ag.build : '') : ag || '—'}</td>
        <td>${(r.timestamp || '').slice(0,19).replace('T',' ')}</td>
      `;
      systemsBody.appendChild(tr);
    });
    systemsSec.style.display = orderedUrls.length ? '' : 'none';
  }

  // ── Chart rendering ──────────────────────────────────────────────────────────
  // Flatten all categories + test names from selected results
  function collectStructure(orderedUrls) {
    const cats = {}; // category → Set of test names
    orderedUrls.forEach(url => {
      const r = allResults[url];
      if (!r || !r.results) return;
      Object.entries(r.results).forEach(([cat, tests]) => {
        if (!cats[cat]) cats[cat] = new Set();
        if (tests && typeof tests === 'object') {
          Object.keys(tests).forEach(t => cats[cat].add(t));
        }
      });
    });
    return cats;
  }

  function getVal(r, cat, test, metric) {
    try { return r.results[cat][test][metric] ?? null; }
    catch { return null; }
  }

  function getStd(r, cat, test) {
    try { return r.results[cat][test].std_dev ?? null; }
    catch { return null; }
  }

  function destroyCharts() {
    Object.values(charts).forEach(c => c.destroy());
    charts = {};
    chartsRoot.innerHTML = '';
  }

  function renderCharts(orderedUrls) {
    destroyCharts();
    const metric = metricSelect.value;
    const cats   = collectStructure(orderedUrls);

    if (!orderedUrls.length) {
      chartsRoot.innerHTML = `<div class="empty">No results selected. <a href="https://github.com/${OWNER}/${REPO}">View the repo</a> to add benchmark JSON files to the results/ folder.</div>`;
      return;
    }

    Object.entries(cats).forEach(([cat, testSet]) => {
      const tests = [...testSet];

      // Section header
      const section = document.createElement('div');
      section.className = 'section';

      const h2 = document.createElement('h2');
      h2.textContent = cat.replace(/_/g,' ').replace(/\b\w/g,c=>c.toUpperCase());
      section.appendChild(h2);

      const grid = document.createElement('div');
      grid.className = 'chart-grid';
      section.appendChild(grid);

      // One chart per test within the category
      tests.forEach(test => {
        const card = document.createElement('div');
        card.className = 'chart-card';

        const h3 = document.createElement('h3');
        h3.textContent = test.replace(/_/g,' ');
        card.appendChild(h3);

        const wrapper = document.createElement('div');
        wrapper.className = 'chart-wrapper';
        const canvas = document.createElement('canvas');
        wrapper.appendChild(canvas);
        card.appendChild(wrapper);
        grid.appendChild(card);

        const labels  = orderedUrls.map((_, i) => `System ${i+1}`);
        const values  = orderedUrls.map(url => getVal(allResults[url], cat, test, metric));
        const errors  = orderedUrls.map(url => getStd(allResults[url], cat, test));

        const datasets = [{
          label: metric.charAt(0).toUpperCase() + metric.slice(1) + ' (s)',
          data:  values,
          backgroundColor: orderedUrls.map((_, i) => PALETTE[i % PALETTE.length] + 'bb'),
          borderColor:     orderedUrls.map((_, i) => PALETTE[i % PALETTE.length]),
          borderWidth: 1.5,
          borderRadius: 4,
        }];

        const chartKey = `${cat}__${test}`;
        charts[chartKey] = new Chart(canvas, {
          type: 'bar',
          data: { labels, datasets },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  title: (items) => {
                    const idx = items[0].dataIndex;
                    const url = orderedUrls[idx];
                    return humanLabel(allResults[url]);
                  },
                  afterBody: (items) => {
                    const idx = items[0].dataIndex;
                    const url = orderedUrls[idx];
                    const sd  = errors[idx];
                    const r   = allResults[url];
                    const trials = r?.results?.[cat]?.[test]?.trials;
                    const lines = [];
                    if (sd != null)  lines.push(`Std Dev: ${sd.toFixed(3)}s`);
                    if (trials)      lines.push(`Trials: [${trials.map(v=>v.toFixed(3)).join(', ')}]`);
                    return lines;
                  }
                }
              }
            },
            scales: {
              x: {
                ticks: { color: '#8b949e', font: { size: 11 } },
                grid:  { color: '#21262d' }
              },
              y: {
                beginAtZero: true,
                title: { display: true, text: 'Seconds', color: '#8b949e', font: { size: 11 } },
                ticks: { color: '#8b949e', font: { size: 11 } },
                grid:  { color: '#21262d' }
              }
            }
          }
        });
      });

      chartsRoot.appendChild(section);
    });
  }

  // ── Main load ────────────────────────────────────────────────────────────────
  async function loadAll() {
    setStatus('Fetching result list…');
    let urls;
    try {
      urls = await fetchFileList();
    } catch (e) {
      setStatus('');
      chartsRoot.innerHTML = `<div class="empty">
        Could not load results from GitHub API.<br>
        Make sure the <strong>results/</strong> folder exists in the repo and contains JSON files.<br>
        <small>${e.message}</small>
      </div>`;
      return;
    }

    if (!urls.length) {
      setStatus('');
      chartsRoot.innerHTML = `<div class="empty">
        No JSON result files found in <code>results/</code>.<br>
        Run the benchmark script and commit the output JSON, then push to GitHub.
      </div>`;
      return;
    }

    setStatus(`Loading ${urls.length} result(s)…`);
    const results = await Promise.allSettled(urls.map(fetchResult));
    results.forEach((r, i) => {
      if (r.status === 'fulfilled') allResults[urls[i]] = r.value;
    });

    populateSelect(urls.filter((_, i) => results[i].status === 'fulfilled'));
    const ordered = [...activeFiles];
    renderSystemsTable(ordered);
    renderCharts(ordered);
    setStatus(`Loaded ${Object.keys(allResults).length} result(s)`);
  }

  // ── Event listeners ──────────────────────────────────────────────────────────
  fileSelect.addEventListener('change', () => {
    syncActiveFiles();
    const ordered = [...fileSelect.options]
      .filter(o => o.selected)
      .map(o => o.value);
    renderSystemsTable(ordered);
    renderCharts(ordered);
  });

  metricSelect.addEventListener('change', () => {
    const ordered = [...fileSelect.options]
      .filter(o => o.selected)
      .map(o => o.value);
    renderCharts(ordered);
  });

  toggleAllBtn.addEventListener('click', () => {
    const allSelected = [...fileSelect.options].every(o => o.selected);
    for (const opt of fileSelect.options) opt.selected = !allSelected;
    toggleAllBtn.textContent = allSelected ? 'Select All' : 'Deselect All';
    fileSelect.dispatchEvent(new Event('change'));
  });

  refreshBtn.addEventListener('click', () => {
    allResults = {};
    loadAll();
  });

  // ── Boot ─────────────────────────────────────────────────────────────────────
  loadAll();
</script>
</body>
</html>
